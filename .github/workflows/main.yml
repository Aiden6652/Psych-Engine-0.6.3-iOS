name: Psych Engine 0.6.3 iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      HAXELIB_ROOT: ${{ github.workspace }}/_haxelib
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 haxelib 库
        id: cache
        uses: actions/cache@v4
        with:
          path: _haxelib
          key: psych063-haxelib-v2

      - name: 安装 Haxe 4.2.4（pkg 版，自带 neko）
        run: |
          set -e
          sudo softwareupdate --install-rosetta --agree-to-license || true
          curl -fL --retry 5 https://github.com/HaxeFoundation/haxe/releases/download/4.2.4/haxe-4.2.4-osx-installer.pkg -o haxe.pkg
          SZ=$(wc -c < haxe.pkg | tr -d ' ')
          echo "size=$SZ"
          if [ "$SZ" -lt 1000000 ]; then echo "下载异常"; exit 1; fi
          sudo installer -pkg haxe.pkg -target /
          which haxe haxelib
          haxe -version
          haxelib version

      - name: 配置 haxelib
        run: |
          set -e
          haxelib setup "$HAXELIB_ROOT"
          haxelib version

      - name: 安装依赖（按 hmm.json）
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          haxelib install lime 7.9.0 --always
          haxelib install openfl 9.1.0 --always
          haxelib install flixel 4.11.0 --always
          haxelib install flixel-addons 2.11.0 --always
          haxelib install flixel-ui --always
          haxelib install hscript --always
          haxelib install hxcpp --always
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit.git master
          # 以下 git 依赖 iOS 用不到（Project.xml 分别受 VIDEOS_ALLOWED / desktop / android 约束），失败不阻断
          haxelib git hxCodec https://github.com/JonnycatMeow/hxCodec-old.git main || echo "skip hxCodec"
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main || echo "skip hxShaders"
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master || echo "skip discord_rpc"
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main || echo "skip androidtools"
          haxelib list

      - name: 初始化 lime
        run: |
          yes "" | haxelib run lime setup || true
          haxelib run lime version || true

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 编译 iOS
        run: |
          set +e
          lime build ios -release -D HXCPP_ARM64 -nocolor 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "### 编译失败 exit=$code" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -iE "error|cannot|failed|undefined" build.log | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $code
          fi

      - name: 打包 IPA
        run: |
          set -e
          APP=$(find export -maxdepth 6 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then find . -maxdepth 8 -name "*.app" -type d | head; exit 1; fi
          echo "产物: $APP"
          rm -rf Payload *.ipa; mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PsychEngine_iOS_unsigned.ipa Payload
          ls -lh *.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine_iOS_unsigned
          path: PsychEngine_iOS_unsigned.ipa
          retention-days: 14
