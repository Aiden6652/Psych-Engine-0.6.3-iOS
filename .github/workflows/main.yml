name: Psych Engine 0.6.3 iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      HAXELIB_ROOT: ${{ github.workspace }}/_haxelib

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 haxelib 库
        id: cache
        uses: actions/cache@v4
        with:
          path: _haxelib
          key: psych063-haxelib-v9
          restore-keys: |
            psych063-haxelib-

      - name: 安装 Haxe 4.2.4（pkg 版，自带 neko）
        run: |
          set -Eeuo pipefail
          curl -fL --retry 5 --retry-delay 5 https://github.com/HaxeFoundation/haxe/releases/download/4.2.4/haxe-4.2.4-osx-installer.pkg -o haxe.pkg
          SZ=$(wc -c < haxe.pkg | tr -d ' ')
          echo "size=$SZ"
          if [ "$SZ" -lt 1000000 ]; then
            echo "下载异常"
            exit 1
          fi
          sudo installer -pkg haxe.pkg -target /
          which haxe haxelib
          haxe -version
          haxelib version

      - name: 配置 haxelib
        run: |
          set -Eeuo pipefail
          mkdir -p "$HAXELIB_ROOT"
          haxelib setup "$HAXELIB_ROOT"
          haxelib version

      - name: 安装依赖
        run: |
          set -Eeuo pipefail

          echo "## 安装核心依赖"
          haxelib git lime https://github.com/PsychEngine-report/LIME-0.6.3-FIX main
          haxelib install openfl 9.1.0 --always
          haxelib install flixel 4.11.0 --always
          haxelib install flixel-addons 2.11.0 --always
          haxelib install flixel-ui 2.4.0 --always
          haxelib install hscript 2.4.0 --always
          haxelib git hxcpp https://github.com/kittycathy233/hxcpp main || {
            echo "hxcpp 安装失败"
            exit 1
          }

          echo "## 安装可选依赖（失败不致命）"
          haxelib remove hxvlc || echo "no hxvlc"
          haxelib remove hxCodec || echo "no hxCodec"
          rm -rf "$HAXELIB_ROOT/hxvlc" "$HAXELIB_ROOT/hxCodec"
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit.git master || echo "skip linc_luajit"
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main || echo "skip hxShaders"
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master || echo "skip discord_rpc"
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main || echo "skip androidtools"

          echo "### haxelib 依赖列表"
          haxelib list

      - name: 初始化 lime
        run: |
          set +e
          echo "### lime setup"
          haxelib run lime setup -y < /dev/null 2>&1 | tail -30
          echo "setup RC=${PIPESTATUS[0]}"
          echo "### lime 自检"
          haxelib run lime --version 2>&1 | tail -5
          echo "lime version RC=${PIPESTATUS[0]}"
          echo "### neko"
          which neko haxe haxelib || true
          neko -version 2>&1 | head -2 || true
          echo "### lime 目录自检"
          haxelib path lime 2>&1 | head -5
          echo "path RC=$?"
          ls -la "$HAXELIB_ROOT/lime/" 2>&1 | head -20
          ls -la "$HAXELIB_ROOT/lime/run.n" 2>&1 || echo "!! 没有 run.n"
          echo "--- haxelib.json ---"
          head -c 400 "$HAXELIB_ROOT/lime/haxelib.json" 2>&1
          echo
          echo "--- 直接跑 run.n ---"
          ( cd "$HAXELIB_ROOT/lime" && neko run.n --version 2>&1 | head -10 ; echo "neko RC=$?" )

      - name: 选择 Xcode
        run: |
          set -Eeuo pipefail
          XCODE_PATH="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "未找到 Xcode.app，继续使用默认工具链"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 编译 iOS（保留完整日志）
        id: build
        continue-on-error: true
        run: |
          set +e
          haxelib list || true
          haxelib run lime build ios -release -nosign 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "lime build RC=$RC build.log=$(wc -c < build.log) bytes"
          exit $RC

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lime-build-log
          path: build.log

      - name: 检查构建结果
        if: steps.build.outcome == 'failure'
        run: |
          echo "### lime 构建失败"
          exit 1

      - name: 查找产物
        run: |
          set -Eeuo pipefail
          APP=$(find export -maxdepth 7 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "### 未找到 .app"
            find . -maxdepth 8 -name "*.app" -type d | head
            exit 1
          fi
          echo "构建产物: $APP"

      - name: 打包 IPA
        run: |
          set -Eeuo pipefail
          APP=$(find export -maxdepth 7 -name "*.app" -type d | head -n 1)
          echo "产物: $APP"
          rm -rf Payload *.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PsychEngine_iOS_unsigned.ipa Payload
          ls -lh *.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine_iOS_unsigned
          path: PsychEngine_iOS_unsigned.ipa
          retention-days: 14
