name: Psych Engine 0.6.3 iOS (hxvlc real video)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 350
    env:
      HAXELIB_ROOT: ${{ github.workspace }}/_haxelib
      # hxvlc 固定到 2023-09 的提交：自带 iOS 静态库(libvlc_device.a)、API 稳定，
      # 且不需要 nullSafety（Haxe 4.2.4 不支持该宏）
      HXVLC_REF: 6807fd692b8affbe6636533e56f5bbf2f52675ec

    steps:
      - uses: actions/checkout@v4

      - name: 恢复仓库自带 assets / mods（不要用 FunkinCrew 覆盖，歌单不匹配会黑屏）
        run: |
          set -Eeuo pipefail
          rm -rf assets mods assets.zip resources.zip
          git checkout -f HEAD -- assets
          git checkout -f HEAD -- example_mods
          mv example_mods mods
          echo "assets 文件数: $(find assets -type f | wc -l)"
          echo "mods 文件数: $(find mods -type f | wc -l)"

      - name: 打包内置资源 resources.zip（首次启动自动释放，免手动解压）
        run: |
          set -Eeuo pipefail
          echo "PE iOS: mods folder" > mods/readme.txt
          # 先在 /tmp 里打，避免把正在写的 zip 自己也包进去
          zip -qry /tmp/resources.zip assets mods
          mkdir -p assets/preload
          mv /tmp/resources.zip assets/preload/resources.zip
          ls -lh assets/preload/resources.zip
          unzip -l assets/preload/resources.zip | head -5

      - name: 缓存 haxelib 库
        uses: actions/cache@v4
        with:
          path: _haxelib
          key: psych063-ios-hxvlc-${{ env.HXVLC_REF }}
          restore-keys: |
            psych063-ios-hxvlc-

      - name: 安装 Haxe 4.2.4（pkg 版，自带 neko）
        run: |
          set -Eeuo pipefail
          curl -fL --retry 5 --retry-delay 5 https://github.com/HaxeFoundation/haxe/releases/download/4.2.4/haxe-4.2.4-osx-installer.pkg -o haxe.pkg
          SZ=$(wc -c < haxe.pkg | tr -d ' ')
          echo "size=$SZ"
          if [ "$SZ" -lt 1000000 ]; then echo "下载异常"; exit 1; fi
          sudo installer -pkg haxe.pkg -target /
          which haxe haxelib
          haxe -version
          haxelib version

      - name: 配置 haxelib
        run: |
          set -Eeuo pipefail
          mkdir -p "$HAXELIB_ROOT"
          haxelib setup "$HAXELIB_ROOT"
          haxelib version

      - name: 安装依赖
        run: |
          set -Eeuo pipefail

          echo "## 核心依赖"
          haxelib install lime 7.9.0 --always
          haxelib set lime 7.9.0
          haxelib install openfl 9.1.0 --always
          haxelib install flixel 4.11.0 --always
          haxelib install flixel-addons 2.11.0 --always
          haxelib install flixel-ui 2.4.0 --always
          haxelib install hscript 2.4.0 --always
          haxelib install format --always
          haxelib install hxp --always || true
          haxelib git hxcpp https://github.com/kittycathy233/hxcpp main

          echo "## hxCodec（仅用于满足 Project.xml 的 <haxelib name=\"hxCodec\" />）"
          echo "##   它的 iOS 实现没有链 libvlc，真正的播放在 source/hxcodec/VideoHandler.hx 兼容层"
          ok=0
          for v in 2.5.1 2.5.0 3.0.2 3.0.0 1.8.1; do
            if haxelib install hxCodec $v --always >/dev/null 2>&1; then ok=1; echo "hxCodec $v 已安装"; break; fi
          done
          if [ "$ok" -ne 1 ]; then
            if haxelib install hxCodec --always >/dev/null 2>&1; then ok=1; echo "hxCodec latest 已安装"; fi
          fi
          [ "$ok" -eq 1 ] || { echo "hxCodec 装不上，Project.xml 会报错"; exit 1; }

          echo "## hxvlc（iOS 上有真 libvlc 静态库，负责真实播放）"
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc.git "$HXVLC_REF"

          echo "## Lua / 模组 / 其他"
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit.git master || echo "skip linc_luajit"
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main || echo "skip hxShaders"
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master || echo "skip discord_rpc"
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main || echo "skip androidtools"

          echo "### haxelib 列表"
          haxelib list

      - name: 校验 hxvlc 的 iOS 静态库
        run: |
          set -Eeuo pipefail
          for d in "$HAXELIB_ROOT/hxvlc/git" "$HAXELIB_ROOT/hxvlc/"*; do
            if [ -d "$d/project/vlc/lib/iOS" ]; then
              echo "hxvlc 路径: $d"
              ls -lh "$d/project/vlc/lib/iOS/"
              if [ ! -f "$d/project/vlc/lib/iOS/libvlc_device.a" ]; then
                echo "!! 缺少 libvlc_device.a，iOS 链接会失败"; exit 1
              fi
              exit 0
            fi
          done
          echo "!! hxvlc 里找不到 iOS 静态库目录"; exit 1

      - name: 校验内置资源包
        run: |
          set -Eeuo pipefail
          ls -lh assets/preload/resources.zip
          unzip -l assets/preload/resources.zip | grep -E "assets/preload/data/introText.txt|mods/readme.txt" || {
            echo "!! resources.zip 内容不对"; exit 1; }

      - name: 初始化 lime
        run: |
          set +e
          haxelib run lime setup -y < /dev/null 2>&1 | tail -20
          haxelib run lime --version 2>&1 | tail -5

      - name: 选择 Xcode
        run: |
          set +e
          ls -d /Applications/Xcode*.app 2>/dev/null
          XCODE_PATH="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 编译 iOS
        id: build
        continue-on-error: true
        run: |
          set +e
          export PATH="/usr/local/bin:$PATH"
          haxelib run lime build ios -release -nosign 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "lime build RC=$RC  log=$(wc -c < build.log) bytes"

          APP=$(find export -maxdepth 8 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "### 没有产物，日志尾部 150 行 ###"
            tail -150 build.log
            exit 1
          fi
          echo "产物: $APP"
          exit $RC

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lime-build-log
          path: build.log

      - name: 检查构建结果
        if: steps.build.outcome == 'failure'
        run: |
          echo "### 构建失败，见 lime-build-log"
          exit 1

      - name: 打包 IPA
        run: |
          set -Eeuo pipefail
          APP=$(find export -maxdepth 8 -name "*.app" -type d | head -n 1)
          echo "产物: $APP"
          du -sh "$APP"

          # 视频 mp4 只放 resources.zip 里（首次启动自动释放），IPA 内不重复塞
          find "$APP" -name "*.mp4" -delete || true

          echo "### 自检：资源是否真的进了 App 包"
          ls "$APP" | head -30
          if [ ! -d "$APP/assets" ]; then echo "!! App 包里没有 assets"; exit 1; fi

          # 兜底：万一 lime 没把 resources.zip 带进去，手动补上
          if [ ! -f "$APP/assets/resources.zip" ]; then
            echo "!! lime 没带 resources.zip，手动补进 App 包"
            cp -f assets/preload/resources.zip "$APP/assets/resources.zip"
          fi
          ls -lh "$APP/assets/resources.zip"

          rm -rf Payload *.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -exec touch -t 202401010000 {} +
          zip -qry PsychEngine_iOS_unsigned.ipa Payload
          ls -lh *.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine_iOS_unsigned
          path: PsychEngine_iOS_unsigned.ipa
          retention-days: 14
