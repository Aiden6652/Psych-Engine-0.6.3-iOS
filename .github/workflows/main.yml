name: Psych Engine 0.6.3 iOS ipa build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 支持手动触发构建

jobs:
  build-ios:
    runs-on: macos-13  # 固定macOS 13，Xcode 14.3，兼容旧版lime/hxcpp
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Haxe 4.2.4（固定兼容版本）
        run: |
          curl -L https://github.com/HaxeFoundation/haxe/releases/download/4.2.4/haxe-4.2.4-osx64.tar.gz -o haxe.tar.gz
          tar xzf haxe.tar.gz
          sudo mv haxe_4.2.4 /usr/local/haxe
          sudo ln -sf /usr/local/haxe/haxe /usr/local/bin/haxe
          sudo ln -sf /usr/local/haxe/haxelib /usr/local/bin/haxelib
          haxelib setup /usr/local/haxe/lib
          haxe -version
          haxelib version

      - name: 安装项目所有依赖库
        run: |
          haxelib install all --always
          haxelib list

      - name: 配置 Xcode 命令行工具
        run: |
          sudo xcode-select -s /Applications/Xcode_14.3.app/Contents/Developer
          xcodebuild -version

      - name: 编译 iOS Release 包（无签名）
        run: |
          # 编译arm64真机版本，禁用代码签名
          lime build ios -release -nocolor -D NO_CODE_SIGN=1 -D HXCPP_ARM64=1

      - name: 打包成 IPA 文件
        run: |
          APP_PATH="build/ios/build/Release-iphoneos/Psych Engine.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r "PsychEngine_0.6.3_iOS_unsigned.ipa" Payload
            echo "IPA 打包完成"
          else
            echo "错误：未找到 .app 产物，编译可能失败"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine_0.6.3_iOS_unsigned
          path: PsychEngine_0.6.3_iOS_unsigned.ipa
          retention-days: 7  # 保留30天
