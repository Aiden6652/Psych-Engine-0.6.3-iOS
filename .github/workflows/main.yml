name: Psych Engine 0.6.3 iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 300
    env:
      HAXELIB_ROOT: ${{ github.workspace }}/_haxelib
      # hxcpp 按「源文件内容 + 编译参数」的哈希缓存每个 .o。
      # 配合下面的 actions/cache 后，只改几个 .hx 时绝大部分 .o 直接命中，
      # 编译时间可以从 ~48 分钟降到几分钟。
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp-cache

    steps:
      - uses: actions/checkout@v4

      - name: 恢复仓库自带 assets / example_mods
        run: |
          set -Eeuo pipefail
          rm -rf assets resources.zip assets/preload/resources.zip mods
          git checkout -f HEAD -- assets
          git checkout -f HEAD -- example_mods
          echo "assets 文件数: $(find assets -type f | wc -l)"
          echo "example_mods 文件数: $(find example_mods -type f | wc -l)"

      - name: 加固 Lua：错误的 setProperty 不再崩游戏（只记日志）
        run: |
          set -Eeuo pipefail
          python3 tools/patch_lua_guard.py
          grep -c "LuaGuard" source/FunkinLua.hx || true

      - name: 打包内置资源 resources.zip（按游戏目录结构：assets/… 与 mods/…）
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/pack
          mkdir -p /tmp/pack/assets
          # 解压后必须是 <Documents>/assets/<...>，不能多一层 preload
          cp -R assets/preload/. /tmp/pack/assets/
          if [ -d assets/fonts ]; then cp -R assets/fonts /tmp/pack/assets/fonts; fi
          cp -R example_mods /tmp/pack/mods
          echo "PE iOS: mods folder" > /tmp/pack/mods/readme.txt
          ( cd /tmp/pack && zip -qry /tmp/resources.zip assets mods )
          mkdir -p assets/preload
          mv /tmp/resources.zip assets/preload/resources.zip
          ls -lh assets/preload/resources.zip
          unzip -l assets/preload/resources.zip | head -10

      - name: 缓存 haxelib 库
        uses: actions/cache@v4
        with:
          path: _haxelib
          key: psych063-haxelib-v12
          restore-keys: |
            psych063-haxelib-

      - name: 缓存 hxcpp 编译产物（提速关键）
        uses: actions/cache@v4
        with:
          path: .hxcpp-cache
          # key 里带上工具链版本：haxe / hxcpp 一变就自动重建缓存，避免脏缓存
          key: hxcpp-cache-haxe424-hxcppfork-v1
          restore-keys: |
            hxcpp-cache-haxe424-

      - name: 安装 Haxe 4.2.4（pkg 版，自带 neko）
        run: |
          set -Eeuo pipefail
          curl -fL --retry 5 --retry-delay 5 https://github.com/HaxeFoundation/haxe/releases/download/4.2.4/haxe-4.2.4-osx-installer.pkg -o haxe.pkg
          SZ=$(wc -c < haxe.pkg | tr -d ' ')
          if [ "$SZ" -lt 1000000 ]; then echo "下载异常"; exit 1; fi
          sudo installer -pkg haxe.pkg -target /
          haxe -version

      - name: 配置 haxelib
        run: |
          set -Eeuo pipefail
          mkdir -p "$HAXELIB_ROOT"
          haxelib setup "$HAXELIB_ROOT"
          mkdir -p "$HXCPP_COMPILE_CACHE"
          echo "### 编译缓存现有体积（命中则很大）"
          du -sh "$HXCPP_COMPILE_CACHE" 2>/dev/null || true

      - name: 安装依赖
        run: |
          set -Eeuo pipefail
          haxelib git lime https://github.com/PsychEngine-report/LIME-0.6.3-FIX main
          haxelib install openfl 9.1.0 --always
          haxelib install flixel 4.11.0 --always
          haxelib install flixel-addons 2.11.0 --always
          haxelib install flixel-ui 2.4.0 --always
          haxelib install hscript 2.4.0 --always
          haxelib git hxcpp https://github.com/kittycathy233/hxcpp main

          # hxvlc 版本选择（很关键）：
          #   - >= 1.8.0：含 2024-06-30 PR #57 「android/ios libs include visual module」的 iOS 库；
          #   - <= 1.9.x：未使用 Haxe 4.3 的 `?.` 安全导航语法（2.3.1 用了，Haxe 4.2.4 直接语法报错）；
          #   - 本仓库 Haxe 固定 4.2.4（升级会连带 hxcpp/iOS 工具链风险，暂不动）。
          #   1.9.5 同时满足以上两条，且包含 Apple 平台的渲染/字幕修复。
          echo "## hxvlc 1.9.5"
          rm -rf "$HAXELIB_ROOT/hxvlc"
          haxelib install hxvlc 1.9.5 --always || { echo "### hxvlc 安装失败"; exit 1; }
          haxelib set hxvlc 1.9.5

          echo "## 可选依赖"
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit.git master || echo "skip linc_luajit"
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main || echo "skip hxShaders"
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master || echo "skip discord_rpc"
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main || echo "skip androidtools"
          haxelib list

      - name: 自检 hxvlc
        run: |
          set +e
          haxelib path hxvlc
          grep -m1 '"version"' "$HAXELIB_ROOT/hxvlc/"*/haxelib.json 2>/dev/null || true
          echo "### iOS 静态库（体积能看出模块多少）###"
          find "$HAXELIB_ROOT" -path "*hxvlc*" -name "*.a" -exec ls -lh {} \; 2>/dev/null | head

      - name: 初始化 lime
        run: |
          set +e
          ( haxelib run lime setup </dev/null ) & PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          kill "$PID" 2>/dev/null || true
          haxelib run lime --version 2>&1 | tail -5

      - name: 选择 Xcode
        run: |
          set +e
          XCODE_PATH="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH/Contents/Developer"; fi
          xcodebuild -version

      - name: 编译 iOS
        id: build
        continue-on-error: true
        run: |
          set +e
          START=$(date +%s)
          haxelib run lime build ios -release -nosign > build.log 2>&1
          RC=$?
          END=$(date +%s)
          echo "lime build RC=$RC  耗时 $((END-START)) 秒  log=$(wc -c < build.log) bytes"

          echo "### 编排日志里 hxcpp 缓存命中情况（'Compiling' 行越多 = 命中越少）###"
          grep -c "Compiling" build.log || true

          echo "### 编译日志末尾 60 行 ###"
          tail -60 build.log
          echo "### Haxe 报错行（.hx:行号）###"
          grep -nE '\.hx:[0-9]+' build.log | tail -40
          echo "### 链接报错行 ###"
          grep -nE '^make: \*\*\*|Error [0-9]+$|Undefined symbols|ld: ' build.log | tail -20

          ERR="$(grep -E '\.hx:[0-9]+' build.log | tail -40)"
          if [ -z "$ERR" ]; then ERR="$(tail -25 build.log)"; fi
          printf '%s\n' "$ERR" | sed -e 's/\r//g' -e 's/%/%25/g' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:900}"
          done

          APP=$(find export -maxdepth 8 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "### 没有 .app 产物 ###"
            exit 1
          fi
          echo "产物: $APP"
          echo "### 缓存体积（构建后）###"
          du -sh "$HXCPP_COMPILE_CACHE" 2>/dev/null || true
          exit $RC

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lime-build-log
          path: build.log

      - name: 检查构建结果
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: 打包 IPA
        run: |
          set -Eeuo pipefail
          APP=$(find export -maxdepth 8 -name "*.app" -type d | head -n 1)
          echo "产物: $APP"
          du -sh "$APP"
          if [ ! -d "$APP/assets" ]; then echo "!! App 包里没有 assets"; exit 1; fi
          if [ ! -f "$APP/assets/resources.zip" ]; then
            cp -f assets/preload/resources.zip "$APP/assets/resources.zip"
          fi
          find "$APP" -name "*.mp4" -delete || true
          rm -rf Payload *.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -exec touch -t 202401010000 {} +
          zip -qry PsychEngine_iOS_unsigned.ipa Payload
          ls -lh *.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine_iOS_unsigned
          path: PsychEngine_iOS_unsigned.ipa
          retention-days: 14
