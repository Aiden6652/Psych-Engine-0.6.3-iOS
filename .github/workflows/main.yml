name: Psych Engine 0.6.3 iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 120

    env:
      HAXE_HOME: ${{ github.workspace }}/_haxe
      HAXELIB_ROOT: ${{ github.workspace }}/_haxelib
      # 让 xcodebuild 跳过代码签名（侧载用，无需开发者账号）
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 Haxe 与 haxelib 库
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            _haxe
            _haxelib
          key: haxe-4.2.4-psych063-v2

      - name: 安装 Haxe 4.2.4
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # Apple Silicon runner 上跑 x86_64 的 Haxe 4.2.4 需要 Rosetta
          sudo softwareupdate --install-rosetta --agree-to-license || true
          # 注意：macOS 包名是 haxe-4.2.4-osx.tar.gz（没有 64）
          curl -fL --retry 5 --retry-delay 5 \
            https://github.com/HaxeFoundation/haxe/releases/download/4.2.4/haxe-4.2.4-osx.tar.gz \
            -o haxe.tar.gz
          SZ=$(wc -c < haxe.tar.gz | tr -d ' ')
          echo "下载大小: $SZ bytes"
          if [ "$SZ" -lt 1000000 ]; then
            echo "下载异常（文件过小，可能 404）"; head -c 200 haxe.tar.gz; exit 1
          fi
          DIR=$(tar tzf haxe.tar.gz | head -1 | cut -d/ -f1)
          echo "解压目录: $DIR"
          tar xzf haxe.tar.gz
          rm -rf _haxe
          mv "$DIR" _haxe
          mkdir -p _haxelib
          ls _haxe

      - name: 配置 haxe / haxelib
        run: |
          set -e
          echo "$HAXE_HOME" >> $GITHUB_PATH
          export PATH="$HAXE_HOME:$PATH"
          haxelib setup "$HAXELIB_ROOT"
          haxe -version
          haxelib version

      - name: 安装依赖（按 hmm.json 精确版本）
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          haxelib install lime 7.9.0 --always
          haxelib install openfl 9.1.0 --always
          haxelib install flixel 4.11.0 --always
          haxelib install flixel-addons 2.11.0 --always
          haxelib install flixel-ui --always
          haxelib install hscript --always
          haxelib install hxcpp --always
          haxelib git linc_luajit https://github.com/Sirox228/linc_luajit.git master
          haxelib git hxCodec https://github.com/JonnycatMeow/hxCodec-old.git main
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main
          haxelib list

      - name: 初始化 lime
        run: |
          yes "" | haxelib run lime setup || true
          haxelib run lime version || true

      - name: 选择 Xcode（用 runner 自带版本，不硬编码路径）
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 编译 iOS（arm64 / release / 免签名）
        run: |
          set +e
          lime build ios -release -D HXCPP_ARM64 -nocolor 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "### 编译失败（exit $code），关键错误：" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -iE "error|cannot|failed|undefined|not found" build.log \
              | grep -viE "warning" | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $code
          fi

      - name: 打包 IPA
        run: |
          set -e
          APP_PATH=$(find export -maxdepth 6 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "### 未找到 .app 产物" >> $GITHUB_STEP_SUMMARY
            find . -maxdepth 8 -name "*.app" -type d | head -20
            exit 1
          fi
          echo "找到产物: $APP_PATH"
          rm -rf Payload *.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PsychEngine_iOS_unsigned.ipa Payload
          ls -lh PsychEngine_iOS_unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine_iOS_unsigned
          path: PsychEngine_iOS_unsigned.ipa
          retention-days: 14
