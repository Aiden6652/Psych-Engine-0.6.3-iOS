name: Psych Engine 0.6.3 iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 150
    env:
      HAXELIB_ROOT: ${{ github.workspace }}/_haxelib

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 haxelib 库
        id: cache
        uses: actions/cache@v4
        with:
          path: _haxelib
          key: psych063-haxelib-v2

      - name: 安装 Haxe 4.2.4（pkg 版，自带 neko）
        run: |
          set -e
          sudo softwareupdate --install-rosetta --agree-to-license || true
          curl -fL --retry 5 https://github.com/HaxeFoundation/haxe/releases/download/4.2.4/haxe-4.2.4-osx-installer.pkg -o haxe.pkg
          SZ=$(wc -c < haxe.pkg | tr -d ' ')
          echo "size=$SZ"
          if [ "$SZ" -lt 1000000 ]; then echo "下载异常"; exit 1; fi
          sudo installer -pkg haxe.pkg -target /
          which haxe haxelib
          haxe -version
          haxelib version

      - name: 配置 haxelib
        run: |
          set -e
          haxelib setup "$HAXELIB_ROOT"
          haxelib version

      - name: 安装依赖（按 hmm.json）
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          haxelib install lime 7.9.0 --always
          haxelib install openfl 9.1.0 --always
          haxelib install flixel 4.11.0 --always
          haxelib install flixel-addons 2.11.0 --always
          haxelib install flixel-ui --always
          haxelib install hscript --always
          haxelib install hxcpp --always
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit.git master
          haxelib git hxCodec https://github.com/JonnycatMeow/hxCodec-old.git main || echo "skip hxCodec"
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main || echo "skip hxShaders"
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master || echo "skip discord_rpc"
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main || echo "skip androidtools"
          haxelib list

      - name: 初始化 lime
        run: |
          ( haxelib run lime setup </dev/null ) & PID=$!
          for i in $(seq 1 30); do kill -0 $PID 2>/dev/null || break; sleep 2; done
          kill $PID 2>/dev/null || true

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # 先让 lime 编译 Haxe + 生成 Xcode 项目（签名失败会退出，但 Haxe 已编译、项目已生成）
      - name: lime 生成项目并编译 Haxe
        run: |
          set +e
          haxelib run lime build ios -release -arm64 2>&1 | tee "$GITHUB_WORKSPACE/lime_gen.log"
          echo "exit=$?"
          ls -la export/release/ios/ 2>/dev/null || true
          ls -la export/release/ios/PsychEngine.xcodeproj 2>/dev/null || echo "xcodeproj 未生成"
          # 不在此处失败，继续到下一步处理

      # 修改 Xcode 项目：禁用签名 + 仅 arm64
      - name: 修改 Xcode 项目禁用签名
        run: |
          set -e
          PROJ="export/release/ios/PsychEngine.xcodeproj/project.pbxproj"
          if [ ! -f "$PROJ" ]; then echo "找不到 $PROJ"; exit 1; fi
          cp "$PROJ" "$PROJ.bak"
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g; s/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' "$PROJ"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g; s/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PROJ"
          sed -i '' '/DEVELOPMENT_TEAM =/d' "$PROJ"
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER =/d' "$PROJ"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 9.0;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' "$PROJ"
          echo "=== 修改后的签名相关设置 ==="
          grep -E "CODE_SIGN|DEVELOPMENT_TEAM|ARCHS|IPHONEOS_DEPLOYMENT" "$PROJ" | head -30

      # 手动 xcodebuild（显式传签名禁用 + arm64 + lime 环境）
      - name: xcodebuild 编译
        run: |
          set -e
          cd export/release/ios
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          export HAXELIB_ROOT="$GITHUB_WORKSPACE/_haxelib"
          export HAXE_HOME="/usr/local"
          xcodebuild -project PsychEngine.xcodeproj -target PsychEngine \
            -configuration Release -sdk iphoneos \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "### xcodebuild 失败 exit=$code" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -iE "error:|failed|undefined|Error " "$GITHUB_WORKSPACE/xcodebuild.log" | tail -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $code
          fi

      - name: 打包 IPA
        run: |
          set -e
          APP=$(find export -maxdepth 8 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then find . -maxdepth 10 -name "*.app" -type d | head; exit 1; fi
          echo "产物: $APP"
          rm -rf Payload *.ipa; mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PsychEngine_iOS_unsigned.ipa Payload
          ls -lh *.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine_iOS_unsigned
          path: PsychEngine_iOS_unsigned.ipa
          retention-days: 14
